# Защита от атак через цепочку поставок (см. docs/07-tooling.md)
packages:
  - "."
# Версии в package.json — всегда точные, даже при `pnpm add pkg@диапазон` (CLAUDE.md → «Код»)
saveExact: true
# Не ставить версии моложе 3 суток: большинство заражённых релизов снимают за часы
minimumReleaseAge: 4320
# Ошибка установки, если у пакета упал уровень доверия публикации (например, пропал provenance)
trustPolicy: no-downgrade
# Транзитивные зависимости только из реестра (по умолчанию true, фиксируем явно)
blockExoticSubdeps: true
# Install-скрипты разрешены только этим пакетам; остальные — запрещены и падают с ошибкой
strictDepBuilds: true
allowBuilds:
  prisma: true
  "@prisma/engines": true
  esbuild: true
