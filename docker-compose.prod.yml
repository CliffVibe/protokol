# Прод на VPS: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# Все значения — из .env рядом с этим файлом (шаблон — .env.example). Образ app собирает CI.
services:
  app:
    image: ghcr.io/cliffvibe/protokol:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  # Миграции и пересев демо (запускается вручную или по cron, в обычном `up` не стартует):
  #   docker compose -f docker-compose.prod.yml run --rm tools pnpm db:deploy
  #   docker compose -f docker-compose.prod.yml run --rm tools pnpm db:reset-demo
  tools:
    image: ghcr.io/cliffvibe/protokol:${TOOLS_TAG:-tools}
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
